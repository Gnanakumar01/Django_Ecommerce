{% extends 'base/base.html' %}

{% block title %}

{% endblock %}

{% block content %}

<section class="select_address_section">
    <div class="select_address_container">
        <form method="post">
            {% csrf_token %}
            <h3 style="text-align: center;">Select an Address</h3>
            <ul>
                {% for address in addresses %}
                <li>
                    <label>
                        <input type="radio" name="address" value="{{ address.id }}">
                        {{ address.full_name }}, {{ address.address_line1 }}, {{ address.city }}, {{ address.state }} -
                        {{ address.pincode }}
                    </label>
                </li>
                {% endfor %}
            </ul>
            <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-primary">Select Address</button>
            </div>
        </form>
        <div class="d-flex justify-content-center">
        <a href="{% url 'add_address'  %}?next={{request.path}}" class="btn btn-secondary mt-2">Add address</a>
        </div>
    </div>
</section>

{% endblock %}
