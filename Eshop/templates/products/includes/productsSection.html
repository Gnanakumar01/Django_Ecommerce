<section id="products-container" class="container my-2">
    
    <div class="row g-4">
        {% for product in products %}
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                {% include 'products/includes/productCard.html' %}
            </div>
        {% empty %}
            <div class="col-12 text-center">
                <p class="text-muted">No such Products Available </p>
            </div>
        {% endfor %}
    </div>
</section>
