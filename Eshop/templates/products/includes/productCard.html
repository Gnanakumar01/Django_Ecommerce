<!-- <div class="product-card"> -->
<div id="products_card" class="card product-card" data-product-id="{{product.id}}" style="width: 17rem;">
    {% if product.thumbnail %}
    <img id="product_image" src="{{product.thumbnail.url}}" class="card-img-top" alt="{{product.title}}">
    {% else %}
    <div class="product-thumb placeholder-img">
        No Image
    </div>
    {% endif %}

    <div class="card-body">
        <a class="img_and_title" href="{% url 'product_details' product.pk %}">
            <h5 id="product_title" class="card-title text-center">{{product.title}}</h5>
        </a>

        <p class="card-text text-center">
            {{product.desc}}
        </p>
        <div>
            <p class="card-text text-center" style="color: green; font-weight: bold;">&#8377;{{product.price}}</p>

            {% if user.is_staff %}

                {% if product.stock > 0 %}
                    <button class="btn btn-success btn-sm w-100 rounded-5">
                        In Stock ({{ product.stock }})
                    </button>
                {% else %}
                    <button class="btn btn-danger btn-sm w-100 rounded-5">
                        Out of Stock
                    </button>
                {% endif %}

            {% else %}

                {% if product.stock > 0 %}
                    <button class="btn btn-sm w-100 add-to-cart rounded-5" id="add_to_cart_btn">
                        Add to Cart
                    </button>
                {% else %}
                    <button class="btn btn-danger btn-sm w-100 rounded-5" disabled>
                        Out of Stock
                    </button>
                {% endif %}

            {% endif %}


        </div>
    </div>
</div>
