{% extends 'base/base.html' %}

{% block title %}
Add Product
{% endblock %}

{% block content %}
<section class="d-flex row">
    <div class="col">
        <img src="{{product.thumbnail.url}}" class="w-100" alt="">
    </div>
    <div class="col">
        <h2>
            {{product.title}}
        </h2>
        <p>
            {{product.desc}}
        </p>
        <p>
            $ {{product.price}}
        </p>

        <div class="d-flex flex-row">
            <a href="" class="btn btn-outline-success">Add to Cart</a>
            <a href="{% url 'edit_product' product.pk %}" class="btn btn-warning">Edit</a>
            <a href="{% url 'delete_product' product.pk %}" class="btn btn-danger">Delete</a>
        </div>
    </div>
</section>
{% endblock %}
