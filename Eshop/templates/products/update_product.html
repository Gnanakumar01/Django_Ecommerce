{% extends 'base/base.html' %}

{% block title %}
Edit Product
{% endblock %}

{% block content %}
<section class="update-product crud_container">
    <div class="update_form_container">
        <form class="update_form" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit">Update Product</button>
        </form>
    </div>
</section>
{% endblock %}
